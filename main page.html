<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #fff url("logo.png") center / contain no-repeat;
            font-family: Arial, sans-serif;
        }

        .menu-button {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            padding: 15px 50px;
            background: #111;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 6px;
        }

        .menu-button:hover {
            background: #444;
        }

        @media (max-width: 600px) {
            .menu-button {
                bottom: 25px;
                padding: 14px 45px;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="menu-button">MENU</a>
</body>
</html>
